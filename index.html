<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | Samadhan Catering Service</title>
  <meta name="description" content="Samadhan Catering Service, Airoli, Navi Mumbai — delicious vegetarian and non-vegetarian catering for weddings, griha pravesh, baby showers, corporate events and small in-house functions.">
  <link rel="icon" href="assets/images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
</head>
<body data-page="home" data-title="Home">

  <div id="site-header"></div>

  <main class="overflow-x-clip">
    <!-- ============ HERO ============ -->
    <section class="relative min-h-[100svh] flex items-center overflow-hidden text-white">
      <img src="assets/images/hero.jpg" alt="Buffet setup by Samadhan Catering Service" class="absolute inset-0 w-full h-full object-cover animate-kenburns motion-reduce:animate-none">
      <div class="absolute inset-0 bg-gradient-to-r from-forest-deep/90 via-forest-deep/55 to-forest-deep/20"></div>
      <div class="absolute inset-x-0 bottom-0 h-28 bg-gradient-to-t from-cream to-transparent"></div>

      <div class="relative mx-auto w-full max-w-7xl px-4 sm:px-6 pt-24 pb-28">
        <div class="grid lg:grid-cols-[1fr_1.05fr] gap-8 items-center">
          <div>
            <p class="eyebrow !text-gold-light animate-fadeUp"><span data-text="business.heroEyebrow"></span></p>
            <h1 class="mt-3 text-5xl sm:text-6xl lg:text-7xl font-medium leading-[1.05] animate-fadeUp" style="animation-delay:.12s" data-text="business.tagline"></h1>
            <p class="mt-4 max-w-lg text-base sm:text-lg text-white/85 leading-relaxed animate-fadeUp" style="animation-delay:.25s" data-text="business.intro"></p>
            <p class="mt-3 font-script text-3xl text-gold-light animate-fadeUp" style="animation-delay:.32s" data-text="business.script"></p>
            <div class="mt-6 flex flex-wrap gap-3 animate-fadeUp" style="animation-delay:.4s">
              <a href="services.html" class="btn btn-gold">Explore Our Services</a>
              <a href="contact.html#enquiry" class="btn btn-glass">Get a Quote</a>
              <a data-link="whatsapp" class="btn btn-glass" aria-label="Chat on WhatsApp">WhatsApp Us</a>
            </div>
          </div>

          <div class="relative w-full animate-fadeUp" style="animation-delay:.35s">
            <div id="hero-carousel" class="relative h-[22rem] sm:h-[27rem]" style="perspective:1400px" aria-roledescription="carousel"></div>
            <div class="mt-3 flex items-center justify-center gap-4">
              <button type="button" id="hc-prev" class="w-10 h-10 rounded-full glass-dark !rounded-full flex items-center justify-center hover:!bg-gold hover:text-forest-deep transition" aria-label="Previous"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
              <div id="hc-dots" class="flex items-center gap-2"></div>
              <button type="button" id="hc-next" class="w-10 h-10 rounded-full glass-dark !rounded-full flex items-center justify-center hover:!bg-gold hover:text-forest-deep transition" aria-label="Next"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ WELCOME ============ -->
    <section class="mx-auto max-w-7xl px-4 sm:px-6 mt-4 grid lg:grid-cols-[.9fr_1.1fr] gap-8 items-center">
      <div data-reveal="left">
        <span class="eyebrow">Our Story</span>
        <h2 class="mt-1 section-title"><span data-text="home.welcomeTitle"></span><br><span data-text="business.fullName" class="text-sage-600"></span></h2>
        <p class="mt-2 max-w-lg text-sm text-charcoal/70 leading-relaxed" data-text="home.welcomeText"></p>
        <div id="home-highlights" class="mt-4 grid sm:grid-cols-3 gap-3"></div>
        <a href="about.html" class="mt-5 btn btn-sage !py-2">Learn More</a>
      </div>

      <div class="relative pb-12 pr-4 sm:pr-12 max-w-xl w-full justify-self-center" data-reveal="right">
        <div class="absolute -top-4 -left-4 w-40 h-40 rounded-full bg-gold/25 blur-2xl"></div>
        <div class="glass !p-2.5 relative"><img src="assets/images/intro-1.jpg" alt="Buffet service at a Samadhan event" loading="lazy" class="w-full aspect-[4/3] object-cover shape-leaf-sm"></div>
        <div class="glass !p-2 absolute bottom-0 left-0 w-2/5 animate-float"><img src="assets/images/intro-2.jpg" alt="Freshly packed meal box" loading="lazy" class="w-full aspect-[5/4] object-cover shape-leaf-sm"></div>
        <div class="glass-dark absolute bottom-3 right-0 px-4 py-3 text-center font-script text-xl text-gold-light leading-7 flex flex-col" id="home-badge"></div>
      </div>
    </section>

    <!-- ============ SERVICE HIGHLIGHTS ============ -->
    <section class="mx-auto max-w-7xl px-4 sm:px-6 mt-10">
      <div class="text-center max-w-2xl mx-auto" data-reveal>
        <span class="eyebrow">What We Do</span>
        <h2 class="mt-1 section-title">We Cater For Every Occasion</h2>
        <p class="mt-1 text-sm text-charcoal/65">Delicious food and dedicated service for every kind of celebration.</p>
      </div>
      <div id="home-services" class="mt-5 grid sm:grid-cols-2 lg:grid-cols-5 gap-4"></div>
      <div class="mt-5 text-center"><a href="services.html" class="btn btn-outline !py-2">View All Services</a></div>
    </section>

    <!-- ============ FOOD PHOTOGRAPHY ============ -->
    <section class="mx-auto max-w-7xl px-4 sm:px-6 mt-10">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4" data-reveal>
        <div>
          <span class="eyebrow">Gallery</span>
          <h2 class="mt-1 section-title" data-text="home.showcaseTitle"></h2>
          <p class="mt-1 text-sm text-charcoal/65" data-text="home.showcaseText"></p>
        </div>
        <a href="gallery.html" class="btn btn-outline !py-2 self-start sm:self-auto">View Full Gallery</a>
      </div>
      <div id="home-showcase" class="mt-5 grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4"></div>
    </section>

    <!-- ============ TESTIMONIALS ============ -->
    <section id="testimonials-section" class="mx-auto max-w-7xl px-4 sm:px-6 mt-10">
      <div class="text-center max-w-2xl mx-auto" data-reveal>
        <span class="eyebrow">Testimonials</span>
        <h2 class="mt-1 section-title" data-text="testimonialsTitle"></h2>
      </div>
      <div id="testimonials-grid" class="mt-9 grid md:grid-cols-3 gap-x-4 gap-y-9"></div>
      <p id="testimonials-note" class="mt-3 text-center text-xs text-charcoal/50"></p>
    </section>

    <!-- ============ CALL TO ACTION ============ -->
    <section data-cta></section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
